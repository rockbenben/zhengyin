# 桌面版发布：tag 是唯一版本源。
#
# validate（版本对账 + 全量测试 + uv lock）→ Windows 打包（NSIS + zip，--publish never）
# → 单一 publish（校验 feed / SHA256 / attestation / 人工审批 / 匿名核验）。
# 发布说明用**仓库里的中文文件** `docs/releases/<tag>.md`；缺文件就停，不发半成品。
#
# 平台首发只有 Windows x64，见 .desktop-policy.json；mac/Linux 的偏离和复查条件也写在那里。
# 本文件必须留在默认分支：tag 触发跑的是被打 tag 那个提交里的 workflow。
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: { description: 'Existing tag to rebuild, e.g. v1.0.0', required: true }

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - id: version
        name: tag 与两份 package.json 对账
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG 不是 vX.Y.Z"; exit 1; }
          v="${TAG#v}"
          root=$(node -p "require('./package.json').version")
          desk=$(node -p "require('./desktop/package.json').version")
          if [ "$root" != "$v" ]; then echo "::error::version mismatch: root package.json $root != tag $v"; exit 1; fi
          if [ "$desk" != "$v" ]; then echo "::error::version mismatch: desktop/package.json $desk != tag $v"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm test
      - name: uv lock 与 pyproject 同步
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" lock --check --project asr-service

  build:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npx install-electron
      - run: npm run build
      - run: npm run build -w desktop
      - run: npm run fetch-runtime
      - run: npm run check:package
      - run: npm run smoke:package
      - run: npm run pack:desktop
      - run: npm run pack:desktop:zip
      # 两个 artifact 分开：upload-artifact 会把多路径压到共同父目录 `desktop/`，
      # 到 publish 那边 latest.yml 就落在 dist/release/ 而不是 dist/ 根上。
      - uses: actions/upload-artifact@v7
        with:
          name: dist-win
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
            desktop/release/*.blockmap
      - uses: actions/upload-artifact@v7
        with:
          name: dist-zip
          if-no-files-found: error
          path: desktop/release-zip/*.zip

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      # 发布说明是**仓库里的文件**（docs/releases/<tag>.md），所以这一份必须 checkout。
      # 少了这一步，工作目录里只有 dist/，下面那句「缺发布说明就停」每次都命中——
      # 发版 100% 失败，而且报错看着像"说明没写"，其实只是仓库没取下来。
      # 取的是**被打 tag 的那个提交**（ref: $TAG），不是默认分支。
      - uses: actions/checkout@v7
        with: { ref: '${{ env.TAG }}' }
      - uses: actions/download-artifact@v8
        with: { pattern: 'dist-*', merge-multiple: true, path: dist }
      - name: 校验 latest.yml 与它指向的文件
        run: |
          cd dist
          [ -f latest.yml ] || { echo "::error::缺 latest.yml"; exit 1; }
          grep -q "^version: $VERSION$" latest.yml || { echo "::error::latest.yml 版本不对"; exit 1; }
          while read -r u; do
            [ -f "$u" ] || { echo "::error::latest.yml 指向不存在的 $u"; exit 1; }
          done < <(grep -E '^\s*-?\s*url:' latest.yml | awk '{print $NF}')
      - name: 校验两种 Windows 产物都在
        run: |
          ls dist/*-setup.exe >/dev/null 2>&1 || { echo "::error::缺 NSIS 安装包"; exit 1; }
          ls dist/*.zip >/dev/null 2>&1 || { echo "::error::缺免安装 zip"; exit 1; }
      - name: SHA256SUMS（LF）
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest@v4
        with: { subject-checksums: dist/SHA256SUMS }
      - name: 建/复用草稿并上传
        run: |
          # 发布说明是**仓库里的中文文件**，不是 GitHub 自动生成的提交笔记。
          # 后者是从英文 commit 生成的，等于在一份中文说明里塞一段英文——
          # 本项目只有中文，说明也就只该有中文。缺文件就停：宁可发布失败，
          # 也不要发出一份说明不全的版本。
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "::error::缺发布说明 $notes，先写好这一版的中文说明再打 tag"; exit 1; }
          if is_draft=$(gh release view "$TAG" -R "$REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$is_draft" = true ] || { echo "::error::$TAG 已经发布过了，改版本号"; exit 1; }
            gh release edit "$TAG" -R "$REPO" --notes-file "$notes"
          else
            gh release create "$TAG" -R "$REPO" --draft --verify-tag --title "$TAG" \
              --notes-file "$notes" --fail-on-no-commits
          fi
          gh release upload "$TAG" -R "$REPO" dist/* --clobber
      - name: 发布并设 latest
        run: |
          id=$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name==\"$TAG\" and .draft) | .id")
          gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false -f make_latest=true >/dev/null
      - name: 匿名核验（像真实用户）
        run: |
          [ "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG" ] || { echo "::error::releases/latest 不是 $TAG"; exit 1; }
          ok=
          for _ in $(seq 1 10); do
            curl -fsSL "https://github.com/$REPO/releases/latest/download/latest.yml" | grep -q "^version: $VERSION$" && { ok=1; break; }
            sleep 60
          done
          [ -n "$ok" ] || { echo "::error::公开的 latest.yml 十分钟后仍不是 $VERSION"; exit 1; }
