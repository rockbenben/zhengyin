# 跑测试和构建。**矩阵里那两个维度都不是凑数的**，各自防一类真出过的问题。
#
# ── 为什么必须有 windows ──
#
# `.gitattributes` 只钉了启动脚本的换行（.cmd 必须 CRLF、.sh 必须 LF），
# **没管 .md**——所以笔记的换行跟着克隆方的 `core.autocrlf` 走。
# Git for Windows 默认 autocrlf=true，于是别人在 Windows 上 clone 到的 notes/*.md
# 是 CRLF，而开发机工作区里是 LF。
#
# 这不是假设：发布前把仓库 clone 一份跑测试，本机全绿、克隆里红一条——
# splitSections 只切 `\n`，CRLF 下标题正则一个都匹配不上，17 篇笔记全抽不出小节，
# 界面上「该怎么发」整块消失。**Linux runner 复现不了这个条件**（那边永远是 LF），
# 只有 windows 会。
#
# ── 为什么 node 是 24.15.0 / 26 ──
#
# **24.15.0 是 `engines.node` 的下限，也是这条矩阵的第一项。**
# 它不是一个随便挑的 LTS 小版本：which@7 的 engines 是
# `^22.22.2 || ^24.15.0 || >=26.0.0`，而 24.0–24.14 正好落在空档里；
# 下限必须落在它允许的区间内，nodeFloor.test.ts 会逐项核对。
#
# 26 是当前 LTS，也是桌面版随包 node.exe 的版本。两条都测：
# 24.15 代表"最低还能装"的那一端，26 代表桌面实际运行时。
# 都写大版本/精确下限、不钉日常小版本——"哪个小版本又出事了"正是要暴露的东西。
#
# **better-sqlite3 必须钉 `~12.11.1`。** 12.9.0 没有 Node 26（ABI 147）的预编译包；
# 13.x 目前没有可用的 GitHub 预编译资产。12.11.1 同时有 24（137）和 26（147）的
# win32-x64 预编译包，所以这一行矩阵是在**真的 Node 24.15 和 Node 26 上各装一遍**。
# 元数据扫描查不出"有没有预编译包"，只有真装才知道。
#
# 不跑 Current（27）：它几个月后就会被顶掉，而 better-sqlite3 是原生模块，
# 新线上未必有预编译包，编不出来的红跟这个仓库没关系。真正要防的"新版本弃用旧写法"
# 那类问题，靠的是 spawnShell.test.ts 那种扫源码的断言，不是靠多跑一个 runner。
#
# ── 没做什么 ──
#
# 不装 uv、不跑 Python 边车：模型 1.2GB，而边车没有测试。
# 逐音素评测那条路在单测里是打桩的，装了也测不到额外的东西。
# `wav.real.test.ts` 要 ffmpeg 和 data/audio，CI 里两样都没有——它自己会跳过，
# 那是写在文件头里的有意设计，不是漏跑。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false          # 一个平台红了，另一个的结果照样要看得到
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 头一项必须是 engines 声明的下限（nodeFloor.test.ts 盯着）。
        node: ['24.15.0', '26']
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v7

      # 换行是这套矩阵的重点，所以先把实际拿到的换行打出来——
      # 哪天 checkout 的默认行为变了，日志里看得见，不用猜。
      - name: 确认这个平台拿到的换行
        shell: bash
        run: |
          f=$(ls notes/*.md | head -1)
          cr=$(tr -cd '\r' < "$f" | wc -c)
          echo "$f: CR $cr 个 → $([ "$cr" -gt 0 ] && echo CRLF || echo LF)"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test          # 里面含类型检查（web + server + desktop）
      - run: npm run build

  asr-lock:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: 只装 uv，不下模型、不起边车
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv lock --check --project asr-service

  desktop-package:
    # 只做门禁，不上传产物：发布包由 release.yml 按 tag 重新构建。
    # needs: test 先等 6 个测试矩阵跑完，红树不再白打一次几百 MB 的包。
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run build
      - run: npm run build -w desktop
      - run: npm run fetch-runtime
      - run: npm run check:package
      - run: npm run smoke:package
      - run: npm run pack:desktop
      - run: npm run pack:desktop:zip
